# Copy this file to secrets.yml (gitignored) and fill in the values.
# aac.env.load_secrets() exports these flat keys into the environment at startup.
# Variables already set in the environment take precedence over this file.

NVIDIA_API_KEY: nvapi-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
KAGGLE_ACCESS_TOKEN: KGAT_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx

# Legacy Kaggle basic-auth pair; only needed when KAGGLE_ACCESS_TOKEN is absent.
# KAGGLE_USERNAME: your-username
# KAGGLE_KEY: your-legacy-api-key

# Optional overrides (defaults shown).
# NVIDIA_BASE_URL: https://integrate.api.nvidia.com/v1
# LOCAL_LLM_BASE_URL: http://localhost:11434/v1
